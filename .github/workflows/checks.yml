name: Course checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Check Chinese pages
        run: python tools/check.py
      - name: Check English pages
        run: python tools/check_en.py
      - name: Compare translations
        run: python tools/audit_en.py
      - name: Test validators
        run: python -m unittest discover -s tools/tests -v
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Test offline pages and interactions
        run: python tools/test_browser.py
